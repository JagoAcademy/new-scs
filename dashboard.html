<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <link rel="apple-touch-icon" href="/images/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCS - Club Command Center</title>
    <link rel="stylesheet" href="/src/style.css">
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans pb-20">

    <nav class="bg-white shadow-sm p-4 flex justify-between items-center border-b sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <a href="/" class="hover:scale-105 transition-transform duration-200 shrink-0">
                <img src="/images/logo.png" alt="SCS Logo" class="h-8 md:h-10">
            </a>
            <div class="hidden sm:block border-l-2 border-gray-200 pl-3 ml-1">
                <h1 class="text-sm md:text-lg font-black text-blue-900 tracking-tight">SCS COMMAND CENTER</h1>
            </div>
        </div>
        
        <div class="flex items-center gap-3 md:gap-4">
            <div class="text-right hidden sm:block">
                <p class="text-sm font-extrabold text-gray-800" id="clubNameDisplay">Memuat...</p>
                <div class="flex items-center justify-end gap-1 mt-0.5">
                    <span class="bg-green-100 text-green-700 text-[9px] font-extrabold px-2 py-0.5 rounded-sm tracking-wider uppercase border border-green-200">Verified</span>
                    <span class="bg-scsGold text-blue-900 text-[9px] font-extrabold px-2 py-0.5 rounded-sm tracking-wider uppercase">Pro Tier</span>
                </div>
            </div>
            <img src="https://ui-avatars.com/api/?name=Klub&background=1e3a8a&color=fff&bold=true" id="clubLogoDisplay" alt="Club Logo" class="w-10 h-10 md:w-11 md:h-11 rounded-full border-2 border-scsGold shadow-sm object-cover">
            <button id="logoutBtn" class="text-red-500 text-xs md:text-sm font-bold hover:underline ml-1 md:ml-2 border border-red-200 px-3 py-1.5 rounded-lg bg-red-50 transition-colors hover:bg-red-100">Keluar</button>
        </div>
    </nav>

    <div class="p-4 md:p-6 max-w-7xl mx-auto mt-2">
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-8">
            <div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between group hover:border-blue-300 transition">
                <div>
                    <p class="text-gray-400 text-[10px] md:text-xs font-bold uppercase tracking-wider mb-1">Total Atlet Aktif</p>
                    <p id="valTotalAtlet" class="text-2xl md:text-3xl font-black text-blue-900">...</p>
                </div>
                <div class="w-10 h-10 bg-blue-50 rounded-full flex items-center justify-center text-xl group-hover:scale-110 transition">🏊‍♂️</div>
            </div>
            <div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between group hover:border-green-300 transition">
                <div>
                    <p class="text-gray-400 text-[10px] md:text-xs font-bold uppercase tracking-wider mb-1">Event Diikuti</p>
                    <p id="valEventAktif" class="text-2xl md:text-3xl font-black text-green-600">...</p>
                </div>
                <div class="w-10 h-10 bg-green-50 rounded-full flex items-center justify-center text-xl group-hover:scale-110 transition">🏆</div>
            </div>
            <div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between group hover:border-yellow-300 transition">
                <div>
                    <p class="text-gray-400 text-[10px] md:text-xs font-bold uppercase tracking-wider mb-1">F1 ID Pending</p>
                    <p id="valF1Pending" class="text-2xl md:text-3xl font-black text-yellow-600">0</p>
                </div>
                <div class="w-10 h-10 bg-yellow-50 rounded-full flex items-center justify-center text-xl group-hover:scale-110 transition">⚠️</div>
            </div>
            <div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between group hover:border-purple-300 transition">
                <div>
                    <p class="text-gray-400 text-[10px] md:text-xs font-bold uppercase tracking-wider mb-1">Poin Klub</p>
                    <p id="valPoinKlub" class="text-2xl md:text-3xl font-black text-purple-600">1,250</p>
                </div>
                <div class="w-10 h-10 bg-purple-50 rounded-full flex items-center justify-center text-xl group-hover:scale-110 transition">⭐</div>
            </div>
        </div>

        <h2 class="text-lg md:text-xl font-extrabold text-blue-900 mb-3 md:mb-4">Aksi Cepat Klub</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mb-10">
            <button class="bg-blue-900 text-white p-5 rounded-2xl text-left shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 relative overflow-hidden group">
                <span class="absolute right-4 top-4 text-white/10 text-6xl group-hover:scale-110 transition-transform origin-bottom-right">👤</span>
                <div class="relative z-10">
                    <span class="text-3xl block mb-2">👤+</span>
                    <h3 class="font-bold text-lg">Tambah Atlet Baru</h3>
                    <p class="text-blue-200 text-xs md:text-sm mt-1">Generate F1 ID manual atau import Excel.</p>
                </div>
            </button>
            <button class="bg-amber-500 text-white p-5 rounded-2xl text-left shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 relative overflow-hidden group">
                <div class="relative z-10">
                    <span class="text-3xl block mb-2">✅</span>
                    <h3 class="font-bold text-lg">Verifikasi F1 ID</h3>
                    <p class="text-amber-100 text-xs md:text-sm mt-1">Review kelengkapan akta kelahiran untuk aktivasi.</p>
                </div>
            </button>
            <button class="bg-white border-2 border-gray-200 text-gray-800 p-5 rounded-2xl text-left shadow-sm hover:shadow-md hover:border-scsBlue transition-all duration-300 transform hover:-translate-y-1 group">
                <span class="absolute top-4 right-4 bg-emerald-100 text-emerald-700 text-[10px] font-extrabold px-2 py-1 rounded-full border border-emerald-200">PANITIA</span>
                <span class="text-3xl block mb-2 group-hover:scale-110 transition-transform origin-left">🚀</span>
                <h3 class="font-bold text-lg group-hover:text-scsBlue transition-colors">Buat Event / Lomba</h3>
                <p class="text-gray-500 text-xs md:text-sm mt-1">Setup landing page dan pendaftaran event Anda.</p>
            </button>
        </div>

        <div class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden mb-10">
            <div class="p-5 md:p-6 border-b border-gray-100 bg-gray-50/50 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h2 class="text-xl font-extrabold text-blue-900">Database Atlet Klub</h2>
                    <p class="text-xs text-gray-500 mt-1">Kelola F1 ID peserta dari Supabase.</p>
                </div>
            </div>

            <div class="w-full overflow-x-auto hide-scrollbar">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead>
                        <tr class="bg-white border-b border-gray-100 text-gray-400 text-xs uppercase tracking-wider">
                            <th class="p-4 font-bold w-10 text-center">No</th>
                            <th class="p-4 font-bold">Profil Atlet</th>
                            <th class="p-4 font-bold">F1 ID Resmi</th>
                            <th class="p-4 font-bold">Tgl Lahir</th>
                            <th class="p-4 font-bold text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="athleteTableBody" class="text-sm divide-y divide-gray-50">
                        <tr>
                            <td colspan="5" class="p-8 text-center text-gray-500">Mencari data atlet di database...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="/src/dashboard.js"></script>
</body>
</html>

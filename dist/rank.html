<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <link rel="apple-touch-icon" href="/images/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Rank | SCS</title>
    
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Custom Dropdown Arrow biar elegan */
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%2364748b' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
            background-repeat: no-repeat;
            background-position-x: 95%;
            background-position-y: 50%;
        }
    </style>
  <link rel="stylesheet" href="/assets/style-4a6a5742.css">
</head>
<body class="bg-slate-50 antialiased font-sans pt-24 pb-20">
    
    <!-- TOP NAVIGATION -->
    <nav class="bg-white/90 backdrop-blur-md shadow-sm fixed w-full z-50 top-0 h-14 md:h-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full">
            <div class="flex justify-between items-center h-full">
                <div class="flex-shrink-0 flex items-center h-full py-1">
                    <a href="/" class="block">
                        <img class="max-h-12 md:max-h-14 w-auto object-contain hover:scale-105 transition-transform duration-200" src="/images/logo.png" alt="SCS Logo">
                    </a>
                </div>
                
                <div class="hidden md:flex space-x-6 lg:space-x-8 items-center">
                    <a href="/event.html" class="text-gray-600 hover:text-blue-900 font-bold text-sm">Event</a>
                    <a href="/rank.html" class="text-blue-900 font-extrabold text-sm flex items-center gap-1">
                        Rank <span class="text-[9px] bg-red-500 text-white px-1.5 py-0.5 rounded-full animate-pulse">HOT</span>
                    </a>
                    <a href="/promosi.html" class="text-gray-600 hover:text-blue-900 font-bold text-sm">Promosi</a>
                    <a href="/auth.html" class="bg-blue-900 text-white px-5 py-2 rounded-full font-bold text-sm hover:bg-blue-800 transition shadow-sm ml-4">Login SCS</a>
                </div>
                
                <a href="/" class="md:hidden text-sm font-bold text-slate-500 hover:text-blue-600">&laquo; Beranda</a>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 mt-4">
        
        <!-- Header -->
        <div class="text-center mb-10">
            <span class="bg-red-100 text-red-600 font-extrabold px-4 py-1.5 rounded-full text-xs uppercase tracking-widest mb-4 inline-block">SCS National Database</span>
            <h1 class="text-3xl md:text-4xl font-black text-blue-900 mb-3 tracking-tight">Leaderboard Atlet</h1>
            <p class="text-slate-500 text-sm md:text-base max-w-lg mx-auto">Pantau 10 besar peringkat catatan waktu terbaik (Personal Best) dari seluruh event resmi di ekosistem SCS.</p>
        </div>

        <!-- Filter Gender (Putra = Biru, Putri = Pink) -->
        <div class="flex justify-center gap-3 mb-6" id="genderToggle">
            <!-- Active State Putra -->
            <button data-gender="Putra" class="gender-btn active px-10 py-2.5 rounded-full font-black text-sm transition-all bg-blue-600 text-white shadow-lg shadow-blue-200 border border-blue-600">
                Putra
            </button>
            <!-- Inactive State Putri -->
            <button data-gender="Putri" class="gender-btn px-10 py-2.5 rounded-full font-bold text-sm transition-all bg-white text-pink-500 border border-pink-200 shadow-sm hover:bg-pink-50 hover:text-pink-600">
                Putri
            </button>
        </div>

        <!-- Filter 2 Dropdown (Jarak & Gaya) -->
        <div class="flex justify-center mb-12 px-2">
            <div class="flex gap-2 w-full max-w-md">
                <!-- Dropdown Jarak -->
                <div class="relative w-1/3">
                    <select id="selectDistance" class="w-full pl-4 pr-8 py-3.5 bg-white border border-slate-200 rounded-xl font-bold text-slate-700 shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 text-sm cursor-pointer transition-all">
                        <option value="25m">25m</option>
                        <option value="50m" selected>50m</option>
                        <option value="100m">100m</option>
                        <option value="200m">200m</option>
                        <option value="400m">400m</option>
                        <option value="800m">800m</option>
                        <option value="1500m">1500m</option>
                    </select>
                </div>
                <!-- Dropdown Gaya -->
                <div class="relative w-2/3">
                    <select id="selectStroke" class="w-full pl-4 pr-8 py-3.5 bg-white border border-slate-200 rounded-xl font-bold text-slate-700 shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 text-sm cursor-pointer transition-all">
                        <option value="Gaya Bebas" selected>Gaya Bebas</option>
                        <option value="Gaya Dada">Gaya Dada</option>
                        <option value="Gaya Punggung">Gaya Punggung</option>
                        <option value="Gaya Kupu-kupu">Gaya Kupu-kupu</option>
                        <option value="Gaya Ganti">Gaya Ganti</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- LEADERBOARD CONTENT (Diisi otomatis oleh JS) -->
        <div id="leaderboardContent">
            <!-- Top 3 Podium Container -->
            <div id="podiumContainer" class="flex items-end justify-center gap-2 md:gap-6 mb-12">
                <!-- Disuntik JS -->
            </div>

            <!-- List Lanjutan (Rank 4 sampai 10) -->
            <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden mb-12">
                <div id="listContainer" class="divide-y divide-slate-100">
                    <!-- Disuntik JS -->
                </div>
            </div>
            
            <div class="text-center pb-10">
                <p class="text-xs text-slate-400 font-bold uppercase tracking-widest">End of Top 10 National Rank</p>
            </div>
        </div>

    </div>

    <!-- Panggil Dummy Script (Tanpa Supabase) -->
    <script src="/src/rank.js"></script>
</body>
</html>

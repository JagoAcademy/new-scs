<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Entry Time | SCS</title>
    
  <script type="module" crossorigin src="/assets/liveResult-26d4ed74.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-3cfb730f.js">
  <link rel="modulepreload" crossorigin href="/assets/supabase-b7fcd0c7.js">
  <link rel="stylesheet" href="/assets/style-4a6a5742.css">
</head>
<body class="bg-slate-100 font-sans text-slate-800 pb-20">

    <!-- GARIS KUNING / HEADER (Revamp dengan Mode Switcher) -->
    <div class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <button onclick="window.history.back()" class="text-slate-300 hover:text-white flex items-center gap-1 text-sm font-bold transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Kembali
                </button>
                <div class="h-4 w-px bg-slate-600 hidden sm:block"></div>
                <h1 class="text-xs md:text-sm font-black tracking-widest text-slate-300 flex items-center gap-2 uppercase hidden sm:flex">
                    Entry Time Panel
                </h1>
            </div>

            <!-- TOGGLE MODE (Di Sini Ajaibnya!) -->
            <div class="flex items-center gap-1 bg-slate-800 p-1 rounded-lg border border-slate-700 w-full sm:w-auto overflow-hidden">
                <button id="btnModeTimer" class="flex-1 sm:flex-none px-4 py-1.5 text-[10px] md:text-xs font-black tracking-widest uppercase rounded bg-red-500 text-white shadow transition-all flex justify-center items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span> TIMER
                </button>
                <button id="btnModeReferee" class="flex-1 sm:flex-none px-4 py-1.5 text-[10px] md:text-xs font-black tracking-widest uppercase rounded text-slate-400 hover:text-white transition-all flex justify-center items-center gap-1">
                    🧑‍⚖️ REFEREE
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 mt-6">
        
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6 relative overflow-hidden">
            <!-- Indikator Mode di Panel -->
            <div id="panelModeIndicator" class="absolute top-0 right-0 bg-red-100 text-red-600 text-[9px] font-black px-3 py-1 rounded-bl-lg uppercase tracking-widest border-b border-l border-red-200">
                Mode Input (Draft)
            </div>

            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Pilih Nomor Lomba (Menampilkan Seluruh Heat)</label>
            <select id="selectEvent" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold focus:ring-2 focus:ring-slate-500 outline-none">
                <option value="">Memuat Lomba...</option>
            </select>
            
            <button id="btnShowAll" class="mt-3 w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold rounded-xl transition-colors border border-slate-200 flex items-center justify-center gap-2 shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                Tampilkan Semua Lomba (Open All)
            </button>
        </div>

        <div id="allHeatsContainer" class="space-y-6 hidden">
            <!-- Render via JS -->
        </div>

    </div>

    
</body>
</html>

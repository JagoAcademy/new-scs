<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etalase Sponsor | SCS Super Admin</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-slate-900 min-h-screen font-sans text-slate-200">
    
    <nav class="bg-black shadow-lg px-4 md:px-8 py-4 border-b border-amber-500/30 flex justify-between items-center sticky top-0 z-50">
        <div class="font-black text-amber-500 tracking-widest uppercase flex items-center gap-2">
            <span>💎</span> SPONSOR BANK SCS
        </div>
        <a href="/admin-ads.html" class="text-xs font-bold text-slate-400 hover:text-white transition-colors bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
            Kembali ke Admin
        </a>
    </nav>

    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
        <div class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-black text-white">Katalog Brand Sponsor</h1>
                <p class="text-slate-400 text-sm mt-1">Katalog brand untuk kebutuhan event.</p>
            </div>
            <button id="btnAddNewSponsor" class="bg-amber-500 hover:bg-amber-400 text-slate-900 font-black px-6 py-3 rounded-xl shadow-[0_0_15px_rgba(245,158,11,0.3)] transition-all flex items-center justify-center gap-2 text-sm shrink-0">
                <span>➕</span> TAMBAH SPONSOR
            </button>
        </div>

        <!-- FILTER TABS -->
        <div class="flex gap-2 border-b border-slate-800 pb-6 mb-6 overflow-x-auto hide-scrollbar">
            <button data-filter="all" class="filter-btn px-4 py-2 bg-amber-500 text-slate-900 font-black text-xs rounded-lg uppercase tracking-wider shrink-0">SEMUA</button>
            <button data-filter="scs_partner" class="filter-btn px-4 py-2 bg-slate-800 text-slate-400 hover:text-white font-bold text-xs rounded-lg uppercase tracking-wider shrink-0 transition">PARTNER SCS</button>
            <button data-filter="unofficial" class="filter-btn px-4 py-2 bg-slate-800 text-slate-400 hover:text-white font-bold text-xs rounded-lg uppercase tracking-wider shrink-0 transition">UNOFFICIAL / PROSPECTIVE</button>
        </div>

        <div id="loadingState" class="text-center py-20 animate-pulse">
            <span class="text-4xl block mb-4">⏳</span>
            <p class="text-amber-500 font-bold tracking-widest uppercase text-sm">Menarik data dari brankas...</p>
        </div>

        <div id="sponsorGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6 hidden">
            <!-- Kartu sponsor diinjeksi lewat JS -->
        </div>
    </div>

    <!-- MODAL EDIT / TAMBAH SPONSOR -->
    <div id="modalEditSponsor" class="fixed inset-0 bg-slate-900/90 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity overflow-y-auto">
        <div class="bg-slate-800 border border-slate-700 rounded-3xl max-w-2xl w-full shadow-2xl overflow-hidden my-auto">
            
            <div class="flex justify-between items-center p-5 border-b border-slate-700 bg-slate-900/50">
                <h3 id="modalTitleText" class="font-black text-amber-400 text-lg uppercase tracking-widest flex items-center gap-2"><span>✏️</span> Detail Sponsor</h3>
                <button id="btnCloseModal" class="text-slate-400 hover:text-white transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>

            <div class="p-5 md:p-6 space-y-5 max-h-[70vh] overflow-y-auto">
                <input type="hidden" id="editSponsorId">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Nama Sponsor</label>
                        <input type="text" id="editSponsorName" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-sm text-white font-bold focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">URL Website / Profil</label>
                        <input type="url" id="editSponsorUrl" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-sm text-blue-400 font-mono focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 pt-2 border-t border-slate-700">
                    <div>
                        <label class="block text-xs font-bold text-emerald-400 mb-1">Status Partner</label>
                        <select id="editSponsorType" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-sm text-white font-bold focus:ring-2 focus:ring-emerald-500 outline-none">
                            <option value="unofficial">⚪ UNOFFICIAL / PROSPECTIVE</option>
                            <option value="scs_partner">🟢 OFFICIAL SCS PARTNER</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-blue-400 mb-1">Kategori Industri</label>
                        <input type="text" id="editSponsorKategori" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-sm text-white font-bold focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Contoh: Hydration / Beverage">
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-5 pt-4 border-t border-slate-700">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1 flex items-center gap-1"><span>🎁</span> Benefit Yang Ditawarkan (Default)</label>
                        <input type="text" id="editSponsorBenefit" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-sm text-slate-300 focus:ring-2 focus:ring-amber-500 outline-none" placeholder="Contoh: Product Support, Booth, Branding">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1 flex items-center gap-1"><span>⚠️</span> Syarat Umum (Default)</label>
                        <textarea id="editSponsorSyarat" rows="3" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-sm text-slate-300 leading-relaxed focus:ring-2 focus:ring-amber-500 outline-none" placeholder="Isi syarat umum..."></textarea>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 pt-4 border-t border-slate-700">
                    <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                        <label class="block text-xs font-bold text-slate-300 mb-1">Update Logo</label>
                        <input type="file" id="editUploadLogo" accept="image/png, image/jpeg" class="w-full text-xs file:bg-slate-700 file:text-white file:rounded file:px-2 file:py-1 file:border-0 text-slate-400 mb-3 outline-none">
                        <div class="w-full h-24 bg-white rounded-lg border-2 border-dashed border-slate-600 flex items-center justify-center p-2 relative overflow-hidden">
                            <span class="text-xs text-slate-400 font-bold z-0">Preview</span>
                            <img id="editPreviewLogo" src="" class="hidden absolute w-full h-full object-contain z-10 p-1">
                        </div>
                    </div>
                </div>
                
                <div id="editStatusMsg" class="hidden text-sm font-bold text-center rounded-lg p-3"></div>
            </div>

            <div class="p-5 border-t border-slate-700 bg-slate-900/50 flex gap-3">
                <button id="btnDeleteSponsor" class="bg-red-900/50 hover:bg-red-800 border border-red-500/50 text-red-200 font-bold py-3 px-4 rounded-xl transition-colors shadow-sm flex items-center gap-2 text-sm shrink-0">
                    Hapus
                </button>
                <button id="btnSaveSponsor" class="flex-1 bg-amber-600 hover:bg-amber-500 text-black font-black py-3 rounded-xl shadow-lg transition-all text-sm">
                    💾 SIMPAN SPONSOR
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/sponsor-preview.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>Sponsor Pitching Generator | SCS Admin</title>
    <link rel="stylesheet" href="/src/style.css">
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 pb-20">

    <nav class="bg-slate-900 text-white shadow-md px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🚀</span>
            <h1 class="text-sm font-black tracking-widest text-emerald-400 uppercase">Pitching Generator</h1>
        </div>
        <a href="/dashboard.html" class="text-slate-300 hover:text-white text-xs font-bold transition-colors">Ke Dashboard &raquo;</a>
    </nav>

    <div class="max-w-6xl mx-auto px-4 mt-8">
        <div class="flex flex-col lg:flex-row gap-8">
            
            <!-- KIRI: FORM PITCHING -->
            <div class="w-full lg:w-1/2 space-y-6">
                <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-200">
                    <h2 class="text-2xl font-black text-slate-800 mb-2">Setup Deck Sponsor</h2>
                    <p class="text-sm text-slate-500 mb-6">Buat link presentasi eksklusif untuk brand yang akan di-pitching.</p>

                    <div class="space-y-5">
                        <!-- NAMA CORPORATE -->
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1.5">Nama Perusahaan (Corporate)</label>
                            <input type="text" id="inputCompanyName" placeholder="Contoh: J99 Corp" class="w-full px-4 py-3 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 font-bold text-blue-900 bg-slate-50">
                        </div>

                        <!-- LOGO CORPORATE -->
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1.5">Logo Corporate (URL Gambar)</label>
                            <input type="text" id="inputCorpLogo" placeholder="https://... (Kosongkan utk pakai logo brand)" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        </div>

                        <!-- DROPDOWN BRAND + BUTTON TAMBAH -->
                        <div class="p-4 bg-indigo-50 border border-indigo-100 rounded-2xl">
                            <label class="block text-xs font-black text-indigo-800 mb-2 uppercase tracking-widest">Brand yang Disimulasikan</label>
                            <div class="flex gap-2">
                                <select id="selectSponsor" class="w-full px-4 py-3 bg-white border border-indigo-200 rounded-xl text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                                    <option value="">-- Pilih Master Sponsor --</option>
                                </select>
                                <button id="btnAddBrand" class="bg-indigo-600 text-white px-5 py-3 rounded-xl font-black hover:bg-indigo-700 transition shadow-sm shrink-0">
                                    + Tambah
                                </button>
                            </div>
                            <div id="selectedBrandsContainer" class="flex flex-wrap gap-2 mt-3 empty:hidden"></div>
                        </div>

                        <!-- INFO KONTAK -->
                        <div class="p-4 bg-slate-50 border border-slate-100 rounded-2xl space-y-4 mt-2">
                            <h3 class="text-[10px] font-black tracking-widest text-slate-400 uppercase">Kontak Target (PIC)</h3>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1.5">Nama PIC / Jabatan</label>
                                <input type="text" id="inputCPName" placeholder="Contoh: Ibu Sandy" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1.5">Nomor WA</label>
                                    <input type="text" id="inputCPWa" placeholder="0812..." class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 font-mono">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1.5">Email</label>
                                    <input type="email" id="inputCPEmail" placeholder="sandy@j99.com" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                                </div>
                            </div>
                        </div>

                        <!-- PESAN PENDEKATAN (COPYWRITING) -->
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1.5">Pesan Pendekatan / Copywriting</label>
                            <textarea id="inputMessage" rows="3" placeholder="Kosongkan untuk menggunakan pesan otomatis bawaan sistem..." class="w-full px-4 py-3 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white"></textarea>
                        </div>

                        <!-- SLUG URL -->
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1.5">Custom Slug URL (Untuk Klien)</label>
                            <div class="flex shadow-sm rounded-xl overflow-hidden border border-slate-300 focus-within:ring-2 ring-blue-500">
                                <span class="bg-slate-100 text-slate-500 px-3 py-3 text-xs font-mono border-r border-slate-300">f1swimming.com/pitch/</span>
                                <input type="text" id="inputSlug" placeholder="j99corp" class="w-full px-3 py-3 text-sm outline-none font-bold text-blue-700 bg-white">
                            </div>
                        </div>

                        <div id="statusMsg" class="hidden text-sm font-bold text-center rounded-lg p-3"></div>

                        <button id="btnGeneratePitch" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl shadow-lg transition-all transform hover:-translate-y-1 mt-4">
                            Generate Pitch Deck & Simpan
                        </button>
                    </div>
                </div>
            </div>

            <!-- KANAN: PREVIEW SIMULASI HP -->
            <div class="w-full lg:w-1/2 flex justify-center items-start lg:sticky lg:top-24 h-max">
                <div class="w-[320px] h-[650px] bg-slate-900 rounded-[2.5rem] p-3 shadow-2xl relative border-4 border-slate-800 ring-4 ring-slate-300">
                    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-6 bg-slate-900 rounded-b-xl z-20"></div>
                    <div class="w-full h-full bg-slate-100 rounded-[1.8rem] overflow-y-auto hide-scrollbar relative">
                        <div class="bg-red-600 text-white p-4 pt-8 sticky top-0 z-10 shadow-md">
                            <h3 class="font-black text-sm text-center tracking-widest uppercase">🔴 Live Result SCS</h3>
                            <p class="text-[9px] text-center text-red-200 mt-0.5">Simulasi Penempatan Iklan</p>
                        </div>
                        <div class="p-3 pb-8" id="simulationContainer">
                            <div class="text-center text-slate-400 font-bold text-xs mt-10 italic border-2 border-dashed border-slate-300 rounded-xl p-6">
                                Tambahkan brand di samping kiri untuk melihat simulasi iklan.
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="/src/pitch.js"></script>
</body>
</html>

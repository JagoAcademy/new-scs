<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Input & Referee Sign-Off | SCS</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-slate-100 font-sans text-slate-800 pb-20">

    <!-- HEADER: TIMER INPUTER & REFEREE SIGN-OFF -->
    <div class="bg-slate-900 text-white sticky top-0 z-50 shadow-md border-b border-slate-800">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <button id="btnBackDashboard" type="button" class="text-slate-300 hover:text-white flex items-center gap-1 text-xs md:text-sm font-bold transition-colors shrink-0 cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Kembali
                </button>
                <div class="h-4 w-px bg-slate-700 shrink-0"></div>
                <div class="min-w-0">
                    <h1 class="text-xs md:text-sm font-black tracking-wider text-amber-400 uppercase truncate">
                        ⏱️ Timer Input & Referee Sign-Off
                    </h1>
                    <p id="headerEventTitle" class="text-[11px] text-slate-300 font-semibold truncate">Memuat event...</p>
                </div>
            </div>

            <!-- TOGGLE MODE: TIMER (INPUTER) vs REFEREE (SIGN & PUBLISH) -->
            <div class="flex items-center gap-1 bg-slate-800 p-1 rounded-lg border border-slate-700 w-full sm:w-auto overflow-hidden">
                <button id="btnModeTimer" type="button" class="flex-1 sm:flex-none px-4 py-1.5 text-[10px] md:text-xs font-black tracking-widest uppercase rounded bg-red-500 text-white shadow transition-all flex justify-center items-center gap-1 cursor-pointer">
                    <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span> TIMER
                </button>
                <button id="btnModeReferee" type="button" class="flex-1 sm:flex-none px-4 py-1.5 text-[10px] md:text-xs font-black tracking-widest uppercase rounded text-slate-400 hover:text-white transition-all flex justify-center items-center gap-1 cursor-pointer">
                    🧑‍⚖️ REFEREE
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 mt-5 space-y-5">

        <!-- BANNER STATUS START LIST (SINKRON BUKU ACARA / KUNCI START LIST) -->
        <div id="startlistStatusBanner" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex items-start gap-3">
                <span id="startlistStatusIcon" class="text-2xl shrink-0">📋</span>
                <div>
                    <p id="startlistStatusTitle" class="text-xs md:text-sm font-black text-slate-800">Memeriksa Start List Terkunci...</p>
                    <p id="startlistStatusDesc" class="text-xs text-slate-500 mt-0.5 leading-relaxed">Membaca susunan seri/heat terbaru setelah Kunci Start List di Buku Acara.</p>
                </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <button id="btnSyncStartlist" type="button" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-blue-50 text-slate-700 hover:text-blue-700 border border-slate-200 text-xs font-extrabold transition cursor-pointer">
                    🔄 Sync Start List
                </button>
                <a id="btnOpenBookLock" href="/book/book.html" class="px-3 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-extrabold shadow-sm transition">
                    📖 Buku Acara
                </a>
            </div>
        </div>

        <!-- FILTER NOMOR LOMBA -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 relative overflow-hidden">
            <div id="panelModeIndicator" class="absolute top-0 right-0 bg-red-100 text-red-600 text-[9px] font-black px-3 py-1 rounded-bl-lg uppercase tracking-widest border-b border-l border-red-200">
                Mode Input (Draft)
            </div>

            <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Pilih Nomor Lomba (Start List Terbaru)</label>
            <select id="selectEvent" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold focus:ring-2 focus:ring-slate-500 outline-none">
                <option value="">Memuat Start List...</option>
            </select>
            
            <button id="btnShowAll" type="button" class="mt-3 w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition-colors border border-slate-200 flex items-center justify-center gap-2 shadow-sm cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                Tampilkan Semua Nomor Lomba (Open All)
            </button>
        </div>

        <div id="allHeatsContainer" class="space-y-6 hidden">
            <!-- Render via JS -->
        </div>

    </div>

    <script type="module" src="/src/live-result.js"></script>
</body>
</html>

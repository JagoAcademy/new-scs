<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Bank Testimoni SCS</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-slate-50 min-h-screen p-6 md:p-12 font-sans">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8 border-b border-slate-200 pb-4">
            <div class="flex items-center gap-3">
                <span class="text-4xl">💉</span>
                <div>
                    <h1 class="text-2xl font-black text-slate-800">Manajemen Testimoni</h1>
                    <p class="text-sm text-slate-500">Kelola bank testimoni klub dan atur penayangan di Landing Page.</p>
                </div>
            </div>
            <a href="/dashboard.html" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg font-bold text-sm hover:bg-slate-300 transition shadow-sm">&laquo; Kembali</a>
        </div>

        <!-- Bagian Input Form -->
        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 md:p-8 mb-8">
            <div class="flex items-center gap-2 mb-6">
                <span class="bg-blue-100 text-blue-700 p-2 rounded-lg text-lg">📝</span>
                <h2 class="text-lg font-extrabold text-slate-800">Suntik Testimoni Baru</h2>
            </div>
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">1. Pilih Klub Sumber</label>
                    <select id="selectClub" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-bold text-slate-700">
                        <option value="">Memuat data klub...</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">2. Isi Testimoni (Real)</label>
                    <textarea id="inputTesti" rows="3" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Contoh: Gila, aplikasi SCS bikin lomba renang klub kami nggak pusing kertas lagi!"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Nama Pemberi Testi</label>
                        <input type="text" id="inputName" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Cth: Coach Fajar">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Jabatan / Peran</label>
                        <input type="text" id="inputRole" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Cth: Head Coach Jago Renang">
                    </div>
                </div>

                <button id="btnSaveTesti" class="w-full bg-slate-800 text-white font-bold py-3.5 rounded-xl hover:bg-slate-900 transition shadow-lg mt-2 flex justify-center items-center gap-2">
                    Simpan ke Bank Testi 💾
                </button>
                <div id="statusMsg" class="hidden text-sm font-bold text-center rounded-lg p-3"></div>
            </div>
        </div>

        <!-- Dashboard / Kontainer Data -->
        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-6 md:p-8 border-b border-slate-100 bg-slate-50 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <h2 class="text-lg font-extrabold text-slate-800 flex items-center gap-2"><span>🗂️</span> Dashboard Testimoni</h2>
            </div>
            
            <!-- Navigation Tabs -->
            <div class="flex gap-2 overflow-x-auto p-4 md:px-8 border-b border-slate-100 hide-scrollbar bg-white">
                <button id="tabLive" class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all shrink-0 bg-green-100 text-green-700 border border-green-200 shadow-sm">
                    🟢 Live (Sedang Tayang)
                </button>
                <button id="tabAll" class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all shrink-0 bg-slate-50 text-slate-600 hover:bg-slate-100 border border-transparent">
                    🟡 Semua Bank Testi
                </button>
                <button id="tabClub" class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all shrink-0 bg-slate-50 text-slate-600 hover:bg-slate-100 border border-transparent">
                    🎯 Sesuai Dropdown Klub
                </button>
            </div>

            <!-- List Container -->
            <div id="testiListContainer" class="p-4 md:p-8 space-y-4 bg-white min-h-[300px]">
                <p class="text-sm text-slate-500 italic text-center mt-10">Memuat database...</p>
            </div>
        </div>
    </div>
    
    <script type="module" src="/src/admin-testi.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Bank Testimoni SCS</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-slate-50 min-h-screen p-6 md:p-12 font-sans">
    <div class="max-w-3xl mx-auto">
        <div class="flex items-center gap-3 mb-8 border-b border-slate-200 pb-4">
            <span class="text-4xl">💉</span>
            <div>
                <h1 class="text-2xl font-black text-slate-800">Manajemen Testimoni</h1>
                <p class="text-sm text-slate-500">Kelola bank testimoni dan atur penayangan di Landing Page.</p>
            </div>
            <a href="/dashboard.html" class="ml-auto bg-slate-200 text-slate-700 px-4 py-2 rounded-lg font-bold text-sm hover:bg-slate-300 transition">&laquo; Kembali</a>
        </div>

        <!-- Form Input -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">1. Pilih Event / Klub</label>
                    <select id="selectEvent" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-bold">
                        <option value="">Memuat data event...</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">2. Isi Testimoni (Real)</label>
                    <textarea id="inputTesti" rows="4" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Contoh: Gila, aplikasi SCS bikin lomba renang klub kami nggak pusing kertas lagi!"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Nama Pemberi Testi</label>
                        <input type="text" id="inputName" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Cth: Coach Fajar">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Jabatan / Peran</label>
                        <input type="text" id="inputRole" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Cth: Head Coach Jago Renang">
                    </div>
                </div>

                <button id="btnSaveTesti" class="w-full bg-slate-800 text-white font-bold py-3.5 rounded-xl hover:bg-slate-900 transition shadow-lg mt-2">
                    Simpan ke Bank Testi 💾
                </button>
                <div id="statusMsg" class="hidden text-sm font-bold text-center rounded-lg p-3"></div>
            </div>
        </div>

        <!-- Daftar Testi (Bank & Live) -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><span>📂</span> Kontainer Testimoni</h2>
            <div id="testiListContainer" class="space-y-3">
                <p class="text-sm text-slate-500 italic">Pilih event di atas untuk melihat testimoninya.</p>
            </div>
        </div>
    </div>
    
    <script type="module" src="/src/admin-testi.js"></script>
</body>
</html>

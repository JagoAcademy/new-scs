<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - SCS Club & Testimoni</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-slate-50 min-h-screen p-6 md:p-12 font-sans">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8 border-b border-slate-200 pb-4">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-white rounded-2xl shadow-sm border border-slate-200 flex items-center justify-center text-2xl">🎛️</div>
                <div>
                    <h1 class="text-2xl font-black text-slate-800 tracking-tight">Super Control Panel</h1>
                    <p class="text-sm text-slate-500 font-medium mt-0.5">Kelola Klub PRO & Penayangan Testimoni LP.</p>
                </div>
            </div>
            <a href="/dashboard.html" class="bg-white border border-slate-200 text-slate-600 px-5 py-2.5 rounded-xl font-bold text-sm hover:bg-slate-50 transition-colors shadow-sm">&laquo; Kembali</a>
        </div>

        <!-- SUNTIKAN BARU: MANAJEMEN PRO CLUB -->
        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 md:p-8 mb-8 overflow-hidden relative">
            <div class="absolute -right-10 -top-10 w-40 h-40 bg-yellow-50 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 relative z-10">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-yellow-50 rounded-xl flex items-center justify-center text-yellow-600 text-xl border border-yellow-100 shadow-inner">👑</div>
                    <div>
                        <h2 class="text-lg font-extrabold text-slate-800">Manajemen PRO Club</h2>
                        <p class="text-[11px] font-bold uppercase tracking-widest text-slate-400 mt-0.5">Suntik Klub Elit ke Halaman Depan</p>
                    </div>
                </div>
                <div class="relative w-full md:w-64 shrink-0">
                    <input type="text" id="searchClubPro" placeholder="Cari nama klub..." class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-700 outline-none focus:ring-2 focus:ring-yellow-500 transition-all shadow-sm">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">🔍</span>
                </div>
            </div>

            <!-- Table Container -->
            <div class="overflow-x-auto relative z-10 bg-white rounded-2xl border border-slate-100">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-100 text-[10px] font-black text-slate-400 uppercase tracking-widest bg-slate-50/80">
                            <th class="py-4 px-5">Nama Klub</th>
                            <th class="py-4 px-5">Status VIP</th>
                            <th class="py-4 px-5 text-right">Aksi Eksekusi</th>
                        </tr>
                    </thead>
                    <tbody id="proClubList" class="divide-y divide-slate-50">
                        <!-- List Disuntik via JS -->
                        <tr>
                            <td colspan="3" class="text-center py-8 text-sm text-slate-400 font-bold italic">Memuat database klub...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination Container -->
            <div class="flex justify-between items-center mt-6 pt-4 border-t border-slate-100 relative z-10">
                <p class="text-[11px] font-bold tracking-widest text-slate-400 uppercase" id="proPaginationInfo">Menampilkan 0 Klub</p>
                <div class="flex gap-2">
                    <button id="btnPrevPro" class="px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-600 text-xs font-bold hover:bg-slate-50 transition shadow-sm disabled:opacity-50">Prev</button>
                    <button id="btnNextPro" class="px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-600 text-xs font-bold hover:bg-slate-50 transition shadow-sm disabled:opacity-50">Next</button>
                </div>
            </div>
        </div>

        <!-- Dashboard Testimoni (Tetap Dibiarkan) -->
        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-6 md:p-8 border-b border-slate-100 bg-slate-50 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <h2 class="text-lg font-extrabold text-slate-800 flex items-center gap-2"><span>🗂️</span> Dashboard Testimoni Lama</h2>
            </div>
            
            <div class="flex gap-2 overflow-x-auto p-4 md:px-8 border-b border-slate-100 hide-scrollbar bg-white">
                <button id="tabLive" class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all shrink-0 bg-green-100 text-green-700 border border-green-200 shadow-sm">
                    🟢 Live (Sedang Tayang)
                </button>
                <button id="tabAll" class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all shrink-0 bg-slate-50 text-slate-600 hover:bg-slate-100 border border-transparent">
                    🟡 Semua Bank Testi
                </button>
            </div>

            <div id="testiListContainer" class="p-4 md:p-8 space-y-4 bg-white min-h-[300px]">
                <p class="text-sm text-slate-500 italic text-center mt-10">Memuat database...</p>
            </div>
        </div>
    </div>
    
    <script type="module" src="/src/admin-testi.js"></script>
</body>
</html>
